; Perfect Dark dedicated-server playlist (example).
;
; Referenced by PLAYLIST=... in the instance config (or --playlist on the CLI).
; See docs/netplay.md for the full field reference; the [server] block sets the
; lobby/vote behaviour, each [entry.N] is one match in the rotation.

[server]
name                = "Perfect Dark Dedicated"
vote_seconds        = 20
vote_candidates     = 3
random_in_pool      = true
; 0 = start immediately with no humans (good for a persistent bot server);
; >0 = wait for that many players before the first match.
min_humans_to_start = 1
; Server-wide weapon / weapon-function bans, applied to every match's final
; loadout (banned weapons become "Nothing" — the pad never spawns; :pri/:sec
; disables just that function via the weapon-preset fn-flag system).
; Comma-separated weapon names (see docs/PORT_SERVER_WEAPON_BANS.md for the
; full token list); group tokens: GADGETS (xray/nightvision/ir/cloak),
; MINES (timed/proximity/remote). Multiple banned= lines OR together.
; Examples:
;   banned = COMBATBOOST, CLOAK, FARSIGHT
;   banned = LAPTOPGUN:sec, DRAGON:sec, MINES
;banned =

[entry.0]
name        = "Skedar TDM"
stage       = SKEDAR
scenario    = COMBAT
preset      = RANDOM
timelimit   = 10
scorelimit  = 25
options     = FASTMOVEMENT
bots        = 4
bot_diff    = HARD
weight      = 3

[entry.1]
name        = "Complex Combat"
stage       = COMPLEX
scenario    = COMBAT
preset      = RANDOM
timelimit   = 12
scorelimit  = 25
bots        = 4
bot_diff    = HARD
weight      = 2

[entry.2]
name        = "G5 Briefcase"
stage       = G5BUILDING
scenario    = HTB
preset      = RANDOM
timelimit   = 12
bots        = 3
bot_diff    = HARD
weight      = 2

[entry.3]
name        = "Ravine Capture"
stage       = RAVINE
scenario    = CTC
preset      = RANDOM
timelimit   = 12
teamscorelimit = 3
options     = TEAMS
bots        = 4
bot_diff    = NORMAL
weight      = 1

[entry.4]
name        = "Warehouse Hill"
stage       = WAREHOUSE
scenario    = KOH
preset      = RANDOM
timelimit   = 10
bots        = 3
bot_diff    = HARD
weight      = 1
